<!doctype html>
<!--
  depth-anything.cpp — DA3 studio.
  Browse sample scenes or upload a video / photos and turn them into a coherent
  point cloud (any pose-capable DA3 model) or 3D gaussians (DA3-Giant), rendered
  here in WebGL2 with depth-sorted EWA splatting. The viewer core (shaders, sort
  worker, camera) follows antimatter15/splat + 3DGS, same as free-splatter.cpp.
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>depth-anything.cpp — DA3 studio</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b0d10; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; color: #e8eaed; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #panel {
    position: fixed; top: 16px; left: 16px; z-index: 10; width: 320px; max-height: calc(100vh - 32px); overflow-y: auto;
    background: rgba(16,19,24,.86); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 14px 16px;
    font-size: 13px; line-height: 1.45; box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  h1 { font-size: 14px; font-weight: 650; letter-spacing: .2px; }
  .sub { color: #8b93a1; font-size: 11.5px; margin-top: 2px; }
  .tabs { display: flex; gap: 6px; margin: 12px 0 10px; }
  .tab { flex: 1; text-align: center; padding: 7px 0; border-radius: 8px; cursor: pointer; font-size: 12.5px;
         background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); color: #b8c0cc; }
  .tab.active { background: linear-gradient(90deg,#3b62c9,#6a3bc9); color: #fff; border-color: transparent; }
  label.fld { display: block; color: #8b93a1; font-size: 11px; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .4px; }
  select, input[type=text] { width: 100%; padding: 7px 9px; font-size: 12.5px; color: #e8eaed;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .chip { font-size: 10.5px; padding: 2px 7px; border-radius: 99px; background: rgba(255,255,255,.07); color: #9aa3b1; }
  .chip.on { background: rgba(90,140,255,.22); color: #bcd0ff; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .seg { display: flex; gap: 6px; margin-top: 6px; }
  .seg button { flex: 1; padding: 6px 0; font-size: 12px; border-radius: 8px; cursor: pointer;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); color: #b8c0cc; }
  .seg button.on { background: rgba(90,140,255,.2); color: #cfe0ff; border-color: rgba(90,140,255,.4); }
  .seg button:disabled { opacity: .35; cursor: not-allowed; }
  button.go { width: 100%; margin-top: 12px; padding: 9px 0; font-size: 13px; font-weight: 600; cursor: pointer;
    color: #fff; border: none; border-radius: 9px; background: linear-gradient(90deg,#3b62c9,#6a3bc9); }
  button.go:disabled { opacity: .5; cursor: progress; }
  .drop { margin-top: 6px; padding: 14px; text-align: center; font-size: 12px; color: #9aa3b1; cursor: pointer;
    border: 1.5px dashed rgba(255,255,255,.16); border-radius: 10px; }
  .drop.hl { border-color: #5b8cff; color: #cfe0ff; }
  #gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .card { border-radius: 10px; overflow: hidden; cursor: pointer; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); }
  .card.active { border-color: #5b8cff; }
  .card img { width: 100%; height: 76px; object-fit: cover; display: block; background: #1a1d22; }
  .card .cap { padding: 5px 7px; font-size: 11px; color: #cdd3dc; }
  .card .cap small { color: #8b93a1; }
  #bar { height: 6px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; margin: 12px 0 8px; }
  #bar > div { height: 100%; width: 0; background: linear-gradient(90deg,#5b8cff,#8a5bff); transition: width .15s ease; }
  .stat { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  .stat span:first-child { color: #8b93a1; }
  #status { margin-top: 8px; color: #9fd3a0; font-size: 11.5px; min-height: 1.2em; }
  #status.err { color: #ff8a8a; }
  .play { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .play button { padding: 5px 10px; border-radius: 7px; cursor: pointer; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); color: #cdd3dc; }
  #steprange { flex: 1; }
  .hide { display: none !important; }
  #hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    color: #6b7280; font-size: 11.5px; background: rgba(16,19,24,.7); padding: 6px 12px; border-radius: 8px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="panel">
  <h1>depth-anything.cpp · DA3 studio</h1>
  <div class="sub">video → coherent point cloud / gaussians, in the browser</div>

  <div class="tabs">
    <div class="tab active" data-tab="scenes">Scenes</div>
    <div class="tab" data-tab="create">Create</div>
  </div>

  <!-- SCENES -->
  <div id="tab-scenes">
    <div id="gallery"></div>
    <div class="play hide" id="playrow">
      <button id="playbtn">▶</button>
      <input type="range" id="steprange" min="0" max="0" value="0"/>
      <span id="stepnum" style="color:#8b93a1;font-size:11px">—</span>
    </div>
  </div>

  <!-- CREATE -->
  <div id="tab-create" class="hide">
    <label class="fld">Model</label>
    <select id="model"></select>
    <div class="chips" id="modelchips"></div>

    <label class="fld">Output</label>
    <div class="seg" id="modeseg">
      <button data-mode="points" class="on">Point cloud</button>
      <button data-mode="gaussians">Gaussians</button>
    </div>

    <label class="fld">Source</label>
    <div class="seg" id="srcseg">
      <button data-src="video" class="on">Video</button>
      <button data-src="photos">Photos</button>
    </div>
    <div class="drop" id="drop">click or drop a video here</div>
    <input type="file" id="file" class="hide"/>

    <div class="row" id="vidparams">
      <div><label class="fld">Max frames</label><input type="text" id="maxframes" value="60"/></div>
      <div><label class="fld">Window</label><input type="text" id="chunk" value="12"/></div>
      <div><label class="fld">Overlap</label><input type="text" id="overlap" value="3"/></div>
      <div><label class="fld">Conf %</label><input type="text" id="confpct" value="55"/></div>
    </div>

    <button class="go" id="gen" disabled>Generate</button>
  </div>

  <div id="bar"><div></div></div>
  <div class="stat"><span>loaded</span><span id="s-loaded">0%</span></div>
  <div class="stat"><span>splats</span><span id="s-splats">0</span></div>
  <div class="stat"><span>fps</span><span id="s-fps">—</span></div>
  <div id="status">ready</div>
</div>
<div id="hint">drag to orbit · scroll to zoom · WASD/arrows to move</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const setStatus = (t, err=false) => { const s=$("status"); s.textContent=t; s.classList.toggle("err",err); };
const ROW = 32;

/* ============================ WebGL viewer core ============================ */
const canvas = $("gl");
const gl = canvas.getContext("webgl2", { antialias:false, premultipliedAlpha:true, alpha:false });
if (!gl) { setStatus("WebGL2 not available", true); throw new Error("no webgl2"); }

const VERT = `#version 300 es
precision highp float; precision highp int;
uniform highp usampler2D u_tex;
uniform mat4 u_proj, u_view;
uniform vec2 u_focal, u_viewport;
in vec2 a_corner; in uint a_index;
out vec4 v_color; out vec2 v_pos;
void main() {
  uint t = a_index * 2u;
  ivec2 wh = textureSize(u_tex, 0);
  uvec4 A = texelFetch(u_tex, ivec2(int(t % uint(wh.x)), int(t / uint(wh.x))), 0);
  uvec4 B = texelFetch(u_tex, ivec2(int((t+1u) % uint(wh.x)), int((t+1u) / uint(wh.x))), 0);
  vec3 center = uintBitsToFloat(A.xyz);
  vec3 scale  = vec3(uintBitsToFloat(A.w), uintBitsToFloat(B.x), uintBitsToFloat(B.y));
  uint rgba = B.z, rotp = B.w;
  v_color = vec4(float(rgba & 0xffu), float((rgba>>8)&0xffu), float((rgba>>16)&0xffu), float((rgba>>24)&0xffu)) / 255.0;
  vec4 q = (vec4(float(rotp&0xffu), float((rotp>>8)&0xffu), float((rotp>>16)&0xffu), float((rotp>>24)&0xffu)) - 128.0) / 128.0;
  q = normalize(q);
  float w=q.x, x=q.y, y=q.z, z=q.w;
  mat3 R = mat3(1.-2.*(y*y+z*z),2.*(x*y+w*z),2.*(x*z-w*y), 2.*(x*y-w*z),1.-2.*(x*x+z*z),2.*(y*z+w*x), 2.*(x*z+w*y),2.*(y*z-w*x),1.-2.*(x*x+y*y));
  mat3 S = mat3(scale.x,0.,0., 0.,scale.y,0., 0.,0.,scale.z);
  mat3 M = R*S; mat3 cov3d = M*transpose(M);
  vec4 cam = u_view * vec4(center,1.0);
  if (cam.z >= -0.2) { gl_Position = vec4(0.,0.,2.,1.); return; }
  vec4 clip = u_proj * cam;
  if (clip.w <= 0.0 || abs(clip.x) > 1.3*clip.w || abs(clip.y) > 1.3*clip.w) { gl_Position = vec4(0.,0.,2.,1.); return; }
  mat3 J = mat3(u_focal.x/cam.z,0.,-(u_focal.x*cam.x)/(cam.z*cam.z), 0.,-u_focal.y/cam.z,(u_focal.y*cam.y)/(cam.z*cam.z), 0.,0.,0.);
  mat3 W = transpose(mat3(u_view)); mat3 T = W*J; mat3 cov2 = transpose(T)*cov3d*T;
  float a = cov2[0][0]+0.3, b = cov2[0][1], c = cov2[1][1]+0.3;
  float det = a*c-b*b; if (det <= 0.0) { gl_Position = vec4(0.,0.,2.,1.); return; }
  float mid = 0.5*(a+c); float rad = sqrt(max(0.,mid*mid-det));
  float l1 = mid+rad, l2 = max(mid-rad,0.1);
  vec2 d = vec2(b, l1-a); vec2 e1 = (dot(d,d)>1e-9)?normalize(d):vec2(1.,0.);
  float MAXPX = 0.3*min(u_viewport.x,u_viewport.y);
  vec2 v1 = min(sqrt(2.*l1),MAXPX)*e1; vec2 v2 = min(sqrt(2.*l2),MAXPX)*vec2(e1.y,-e1.x);
  vec2 ndc = clip.xy/clip.w; vec2 offset = (a_corner.x*v1 + a_corner.y*v2)/u_viewport*2.0;
  v_pos = a_corner; gl_Position = vec4(ndc+offset, clip.z/clip.w, 1.0);
}`;
const FRAG = `#version 300 es
precision highp float; in vec4 v_color; in vec2 v_pos; out vec4 o;
void main(){ float p=-dot(v_pos,v_pos); if(p<-4.0) discard; float a=exp(p)*v_color.a; o=vec4(v_color.rgb*a,a); }`;

function shader(t,src){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER,VERT)); gl.attachShader(prog, shader(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){ setStatus(gl.getProgramInfoLog(prog),true); throw new Error("link"); }
gl.useProgram(prog);
const quad = new Float32Array([-2,-2,2,-2,2,2,-2,-2,2,2,-2,2]);
const quadBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf); gl.bufferData(gl.ARRAY_BUFFER,quad,gl.STATIC_DRAW);
const aCorner = gl.getAttribLocation(prog,"a_corner");
const idxBuf = gl.createBuffer(); const aIndex = gl.getAttribLocation(prog,"a_index");
const tex = gl.createTexture(); const TEX_W = 2048;
const U = { proj:gl.getUniformLocation(prog,"u_proj"), view:gl.getUniformLocation(prog,"u_view"),
  focal:gl.getUniformLocation(prog,"u_focal"), viewport:gl.getUniformLocation(prog,"u_viewport") };
gl.uniform1i(gl.getUniformLocation(prog,"u_tex"),0);
gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND);
gl.blendFuncSeparate(gl.ONE,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);

let count=0, positions=new Float32Array(0), texData=new Uint32Array(0), framed=false;
function resetStore(){ count=0; positions=new Float32Array(0); texData=new Uint32Array(0); framed=false;
  sortedCount=0; $("s-splats").textContent="0"; }
function ensureCap(n){ if(n*8<=texData.length) return;
  const cap=Math.max(n,Math.ceil(texData.length/8*1.5),65536);
  const td=new Uint32Array(cap*8); td.set(texData); texData=td;
  const ps=new Float32Array(cap*3); ps.set(positions); positions=ps; }
function uploadTexture(){ const rows=Math.ceil((count*2)/TEX_W); const buf=new Uint32Array(TEX_W*rows*4);
  buf.set(texData.subarray(0,count*8));
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32UI,TEX_W,rows,0,gl.RGBA_INTEGER,gl.UNSIGNED_INT,buf);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST); }
function ingestBytes(bytes){ const n=Math.floor(bytes.byteLength/ROW); ensureCap(n);
  const f32=new Float32Array(bytes.buffer,bytes.byteOffset,n*8); const u32=new Uint32Array(bytes.buffer,bytes.byteOffset,n*8);
  texData.set(u32.subarray(0,n*8),0);
  for(let i=0;i<n;i++){ positions[i*3]=f32[i*8]; positions[i*3+1]=f32[i*8+1]; positions[i*3+2]=f32[i*8+2]; }
  count=n; uploadTexture(); $("s-splats").textContent=count.toLocaleString();
  if(count>2000) frameToData(); }

const worker = new Worker(URL.createObjectURL(new Blob([`
let pos=null,n=0;
onmessage=(e)=>{ if(e.data.pos){pos=e.data.pos;n=e.data.n;return;} if(!pos)return;
  const view=e.data.view,N=Math.min(n,e.data.n); const d=new Float32Array(N); let dmin=Infinity,dmax=-Infinity;
  for(let i=0;i<N;i++){ const z=view[2]*pos[i*3]+view[6]*pos[i*3+1]+view[10]*pos[i*3+2]; d[i]=z; if(z<dmin)dmin=z; if(z>dmax)dmax=z; }
  const B=65536,cnt=new Uint32Array(B); const scale=dmax>dmin?(B-1)/(dmax-dmin):0; const key=new Uint16Array(N);
  for(let i=0;i<N;i++){ let k=((d[i]-dmin)*scale)|0; k=k<0?0:k>65535?65535:k; key[i]=k; cnt[k]++; }
  for(let i=1;i<B;i++) cnt[i]+=cnt[i-1]; const order=new Uint32Array(N);
  for(let i=N-1;i>=0;i--) order[--cnt[key[i]]]=i; postMessage({order,n:N},[order.buffer]); };
`],{type:"text/javascript"})));
let sortedIndex=new Uint32Array(0), sortedCount=0, sorting=false, sortDirty=true;
worker.onmessage=(e)=>{ sortedIndex=e.data.order; sortedCount=e.data.n; sorting=false;
  gl.bindBuffer(gl.ARRAY_BUFFER,idxBuf); gl.bufferData(gl.ARRAY_BUFFER,sortedIndex,gl.DYNAMIC_DRAW); };
function requestSort(view){ if(sorting||count===0) return; sorting=true;
  worker.postMessage({pos:positions.slice(0,count*3),n:count}); worker.postMessage({view,n:count}); }

const _p=new URLSearchParams(location.search);
let target=[0,0,0], yaw=+(_p.get("yaw")??0), pitch=+(_p.get("pitch")??0.05), dist=2.0, distLock=false;
let curMode="points", orbitLimit=null;   // orbitLimit set for gaussian (input-view) scenes
function frameToData(){ if(framed||count===0) return;
  if(curMode==="gaussians"){ frameInputView(); framed=true; sortDirty=true; return; }
  let lo=[1e30,1e30,1e30],hi=[-1e30,-1e30,-1e30];
  for(let i=0;i<count;i++) for(let k=0;k<3;k++){ const v=positions[i*3+k]; if(v<lo[k])lo[k]=v; if(v>hi[k])hi[k]=v; }
  const diag=Math.hypot(hi[0]-lo[0],hi[1]-lo[1],hi[2]-lo[2]);
  target=[(lo[0]+hi[0])/2,(lo[1]+hi[1])/2,(lo[2]+hi[2])/2]; if(!distLock) dist=Math.max(0.5,0.7*diag);
  orbitLimit=null; framed=true; sortDirty=true; }
// DA3 single-image gaussians are view-synthesis primitives: their depth is spread,
// but they composite into the sharp INPUT view (the camera sits at the world origin).
// So frame from the origin looking at the content's median, and clamp the orbit to
// stay near that view instead of orbiting into the (expected) depth-spread floaters.
function frameInputView(){
  const step=Math.max(1,Math.floor(count/4000)); const xs=[],ys=[],zs=[];
  for(let i=0;i<count;i+=step){ xs.push(positions[i*3]); ys.push(positions[i*3+1]); zs.push(positions[i*3+2]); }
  const med=a=>{ a.sort((p,q)=>p-q); return a[a.length>>1]; };
  const c=[med(xs),med(ys),med(zs)]; target=c;
  const D=Math.hypot(c[0],c[1],c[2])||1; dist=D;              // eye lands exactly at the origin
  const dir=[-c[0]/D,-c[1]/D,-c[2]/D];                        // target -> eye(origin)
  pitch=Math.asin(Math.max(-1,Math.min(1,dir[1]))); yaw=Math.atan2(dir[0],dir[2]);
  orbitLimit={yaw0:yaw,pitch0:pitch,d:0.3,dmin:D*0.5,dmax:D*1.25};
}
const keys={}; addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true); addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
let drag=false,lx=0,ly=0;
canvas.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener("pointerup",()=>drag=false);
canvas.addEventListener("pointermove",e=>{ if(!drag)return; yaw-=(e.clientX-lx)*0.005; pitch-=(e.clientY-ly)*0.005;
  pitch=Math.max(-1.5,Math.min(1.5,pitch));
  if(orbitLimit){ const L=orbitLimit;
    yaw=Math.max(L.yaw0-L.d,Math.min(L.yaw0+L.d,yaw)); pitch=Math.max(L.pitch0-L.d,Math.min(L.pitch0+L.d,pitch)); }
  lx=e.clientX; ly=e.clientY; sortDirty=true; });
canvas.addEventListener("wheel",e=>{ dist*=Math.exp(e.deltaY*0.001); dist=Math.max(0.05,Math.min(50,dist));
  if(orbitLimit) dist=Math.max(orbitLimit.dmin,Math.min(orbitLimit.dmax,dist));
  distLock=true; sortDirty=true; e.preventDefault(); },{passive:false});
function perspective(f,a,n,fr){ const t=1/Math.tan(f/2); return new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(fr+n)/(n-fr),-1,0,0,(2*fr*n)/(n-fr),0]); }
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=(a)=>{const l=Math.hypot(...a)||1;return[a[0]/l,a[1]/l,a[2]/l];};
function lookAt(eye,c){ const z=norm(sub(eye,c)),x=norm(cross([0,1,0],z)),y=cross(z,x);
  return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]); }
function resize(){ const dpr=Math.min(devicePixelRatio,2); canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr; gl.viewport(0,0,canvas.width,canvas.height); }
addEventListener("resize",resize); resize();
let frames=0,fpsT=performance.now();
function render(){
  const speed=dist*0.02; const fwd=[Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)];
  const right=norm(cross([0,1,0],fwd));
  if(!orbitLimit){  // WASD panning would break the fixed input-view for gaussians
    if(keys["w"]||keys["arrowup"]){for(let i=0;i<3;i++)target[i]-=fwd[i]*speed;sortDirty=true;}
    if(keys["s"]||keys["arrowdown"]){for(let i=0;i<3;i++)target[i]+=fwd[i]*speed;sortDirty=true;}
    if(keys["a"]||keys["arrowleft"]){for(let i=0;i<3;i++)target[i]-=right[i]*speed;sortDirty=true;}
    if(keys["d"]||keys["arrowright"]){for(let i=0;i<3;i++)target[i]+=right[i]*speed;sortDirty=true;}
  }
  const eye=[target[0]+dist*Math.sin(yaw)*Math.cos(pitch),target[1]+dist*Math.sin(pitch),target[2]+dist*Math.cos(yaw)*Math.cos(pitch)];
  const view=lookAt(eye,target); const aspect=canvas.width/canvas.height; const fovy=1.0;
  const proj=perspective(fovy,aspect,0.05,100); const fy=canvas.height/(2*Math.tan(fovy/2)),fx=fy;
  if(sortDirty){ requestSort(view); sortDirty=false; }
  gl.clearColor(0.043,0.051,0.063,1); gl.clear(gl.COLOR_BUFFER_BIT); gl.useProgram(prog);
  gl.uniformMatrix4fv(U.view,false,view); gl.uniformMatrix4fv(U.proj,false,proj);
  gl.uniform2f(U.focal,fx,fy); gl.uniform2f(U.viewport,canvas.width,canvas.height);
  gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf); gl.enableVertexAttribArray(aCorner); gl.vertexAttribPointer(aCorner,2,gl.FLOAT,false,0,0);
  if(sortedCount>0){ gl.bindBuffer(gl.ARRAY_BUFFER,idxBuf); gl.enableVertexAttribArray(aIndex);
    gl.vertexAttribIPointer(aIndex,1,gl.UNSIGNED_INT,0,0); gl.vertexAttribDivisor(aIndex,1);
    gl.drawArraysInstanced(gl.TRIANGLES,0,6,sortedCount); }
  frames++; const now=performance.now(); if(now-fpsT>500){ $("s-fps").textContent=Math.round(frames*1000/(now-fpsT)); frames=0; fpsT=now; }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

let loadToken=0;
async function loadSplat(url,{reframe=true}={}){
  const my=++loadToken;
  try{
    setStatus("loading…"); if(reframe){ resetStore(); }
    const resp=await fetch(url); if(!resp.ok) throw new Error("HTTP "+resp.status);
    const total=+resp.headers.get("content-length")||0; const reader=resp.body.getReader();
    let chunks=[],received=0,lastIngest=0;
    while(true){ const {done,value}=await reader.read(); if(done) break; if(my!==loadToken) return;
      chunks.push(value); received+=value.byteLength;
      if(total){ const pct=Math.min(100,Math.round(received/total*100)); $("bar").firstElementChild.style.width=pct+"%"; $("s-loaded").textContent=pct+"%"; }
      if(received-lastIngest>512*ROW||!total){ const all=new Uint8Array(received); let o=0; for(const c of chunks){all.set(c,o);o+=c.byteLength;} ingestBytes(all); sortDirty=true; lastIngest=received; } }
    if(my!==loadToken) return;
    const all=new Uint8Array(received); let o=0; for(const c of chunks){all.set(c,o);o+=c.byteLength;} ingestBytes(all); sortDirty=true;
    $("bar").firstElementChild.style.width="100%"; $("s-loaded").textContent="100%";
    setStatus(`ready · ${count.toLocaleString()} splats`);
  }catch(err){ setStatus(err.message,true); console.error(err); }
}

/* ================================ UI ================================ */
// tabs
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===t));
  $("tab-scenes").classList.toggle("hide",t.dataset.tab!=="scenes");
  $("tab-create").classList.toggle("hide",t.dataset.tab!=="create");
});

// ---- models ----
let MODELS=[], curModel=null;
async function loadModels(){
  const r=await (await fetch("/api/models")).json(); MODELS=r.models||[];
  const sel=$("model"); sel.innerHTML="";
  for(const m of MODELS){ const o=document.createElement("option"); o.value=m.name; o.textContent=m.label; if(m.name===r.default) o.selected=true; sel.appendChild(o); }
  sel.onchange=()=>pickModel(sel.value); pickModel(sel.value||(MODELS[0]&&MODELS[0].name));
}
function pickModel(name){ curModel=MODELS.find(m=>m.name===name)||null;
  const chips=$("modelchips"); chips.innerHTML="";
  if(curModel){ const add=(t,on)=>{const c=document.createElement("span");c.className="chip"+(on?" on":"");c.textContent=t;chips.appendChild(c);};
    add(curModel.backbone,true); add("points",curModel.pose); if(curModel.gaussians) add("gaussians",true); if(curModel.metric) add("metric",true); }
  const gBtn=document.querySelector('#modeseg button[data-mode="gaussians"]');
  gBtn.disabled=!(curModel&&curModel.gaussians);
  if(gBtn.disabled&&gBtn.classList.contains("on")) setMode("points");
}
// ---- mode / source segmented ----
let mode="points", src="video";
function setMode(m){ mode=m; document.querySelectorAll('#modeseg button').forEach(b=>b.classList.toggle("on",b.dataset.mode===m)); }
function setSrc(sv){ src=sv; document.querySelectorAll('#srcseg button').forEach(b=>b.classList.toggle("on",b.dataset.src===sv));
  $("vidparams").classList.toggle("hide",sv!=="video"); chosen=null; dropText(); refreshGen(); }
document.querySelectorAll('#modeseg button').forEach(b=>b.onclick=()=>{ if(!b.disabled) setMode(b.dataset.mode); });
document.querySelectorAll('#srcseg button').forEach(b=>b.onclick=()=>setSrc(b.dataset.src));

// ---- file pick / drop ----
let chosen=null;
const drop=$("drop"), fileInput=$("file");
// Set the picker filter fresh on every open (a reused <input> otherwise keeps a
// stale accept), and clear value so re-picking the same file still fires onchange.
drop.onclick=()=>{ fileInput.value=""; fileInput.toggleAttribute("multiple",src==="photos");
  fileInput.setAttribute("accept",src==="video"?"video/*":"image/*"); fileInput.click(); };
fileInput.onchange=()=>{ chosen=fileInput.files; reflectChosen(); };
["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("hl");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("hl");}));
drop.addEventListener("drop",e=>{ chosen=e.dataTransfer.files; reflectChosen(); });
function dropText(){ drop.textContent=(chosen&&chosen.length)?(chosen.length>1?`${chosen.length} files`:chosen[0].name)
  :`click or drop a ${src==="video"?"video":"photo(s)"} here`; }
function reflectChosen(){ dropText(); refreshGen(); }
function refreshGen(){ $("gen").disabled=!(chosen&&chosen.length); }

// ---- generate ----
$("gen").onclick=async()=>{
  if(!chosen||!chosen.length) return;
  $("gen").disabled=true;
  try{
    if(src==="video"){
      const fd=new FormData(); fd.append("video",chosen[0]); fd.append("name",chosen[0].name.replace(/\.[^.]+$/,""));
      fd.append("model",curModel.name); fd.append("mode",mode);
      fd.append("max_frames",$("maxframes").value); fd.append("conf_pct",$("confpct").value);
      fd.append("chunk_size",$("chunk").value); fd.append("overlap",$("overlap").value);
      setStatus("uploading video…");
      const r=await (await fetch("/api/scene/from-video",{method:"POST",body:fd})).json();
      if(r.error){ throw new Error(r.error); }
      await pollScene(r.job);
    } else {
      const fd=new FormData(); for(const f of chosen) fd.append("images",f);
      fd.append("model",curModel.name); fd.append("mode",mode); fd.append("conf_pct",$("confpct").value);
      setStatus(`running ${mode}…`);
      const resp=await fetch("/api/reconstruct",{method:"POST",body:fd});
      if(!resp.ok) throw new Error(await resp.text());
      const r=await resp.json();
      setStatus(`done · ${r.n.toLocaleString()} splats · ${r.seconds.toFixed(1)}s`);
      await loadSplat("/api/splat/"+r.id);
    }
  }catch(err){ setStatus(err.message,true); }
  $("gen").disabled=false;
};
async function pollScene(job){
  for(;;){
    await new Promise(r=>setTimeout(r,1200));
    const j=await (await fetch("/api/scene/status/"+encodeURIComponent(job))).json();
    if(j.state==="running"){ setStatus(`baking… ${j.done}/${j.total||"?"} frames`); continue; }
    if(j.state==="error"){ throw new Error(j.error||"bake failed"); }
    setStatus("scene ready"); await loadScenes(); document.querySelector(".tab[data-tab='scenes']").click(); openScene(j.scene); return;
  }
}

// ---- scenes gallery + build-up playback ----
let SCENES=[], curScene=null, steps=[], stepI=0, playTimer=null;
async function loadScenes(){
  const r=await (await fetch("/api/scenes")).json(); SCENES=r.scenes||[];
  const g=$("gallery"); g.innerHTML="";
  if(!SCENES.length){ g.innerHTML='<div class="sub" style="grid-column:1/3">No scenes yet — create one →</div>'; return; }
  for(const sc of SCENES){ const card=document.createElement("div"); card.className="card"; card.dataset.name=sc.name;
    card.innerHTML=`<img src="${sc.thumb||""}" onerror="this.style.opacity=.2"/><div class="cap">${sc.label}<br><small>${sc.mode||"points"} · ${sc.steps} steps</small></div>`;
    card.onclick=()=>openScene(sc.name); g.appendChild(card); }
}
async function openScene(name){
  curScene=name; document.querySelectorAll(".card").forEach(c=>c.classList.toggle("active",c.dataset.name===name));
  const m=await (await fetch(`/scenes-assets/${name}/manifest.json`)).json();
  curMode=m.mode||"points";
  steps=m.steps||[]; if(!steps.length) return;
  $("playrow").classList.remove("hide"); $("steprange").max=steps.length-1;
  stepI=steps.length-1; $("steprange").value=stepI; distLock=false;
  await showStep(stepI,true);
  if(steps.length>1) playFrom(0);
}
async function showStep(i,reframe){ stepI=i; $("steprange").value=i; const st=steps[i];
  $("stepnum").textContent=`${st.n}${st.label?" · "+st.label:""}`;
  await loadSplat(`/scenes-assets/${curScene}/${st.splat}`,{reframe});
}
$("steprange").oninput=()=>{ stopPlay(); showStep(+$("steprange").value,false); };
$("playbtn").onclick=()=>{ if(playTimer) stopPlay(); else playFrom(stepI>=steps.length-1?0:stepI); };
function playFrom(i){ stopPlay(); $("playbtn").textContent="⏸"; let k=i; distLock=(k>0);
  const tick=async()=>{ await showStep(k, k===0); k++; if(k>=steps.length){ stopPlay(); return; } playTimer=setTimeout(tick,1300); };
  tick();
}
function stopPlay(){ if(playTimer){ clearTimeout(playTimer); playTimer=null; } $("playbtn").textContent="▶"; }

// init
setSrc("video"); setMode("points");
loadModels().catch(e=>setStatus("models: "+e.message,true));
loadScenes().then(()=>{ if(SCENES.length) openScene(SCENES[0].name); }).catch(()=>{});
</script>
